        if (stack.some(context => context.type === 'list') && ['number', 'string', 'variable'].includes(kind)) token.concepts.push('list');
        if (text === 'def') declaration = true;
        if (text === '(') { stack.push({ type: declaration ? 'parameters' : previous && /^[A-Za-z_]\w*$/.test(previous.text) ? 'arguments' : 'group' }); declaration = false; }
        if (text === '[') stack.push({ type: 'list' });
        if (text === ')' || text === ']') stack.pop();
        if (text === 'return') returnLine = true;
        token.concepts = [...new Set(token.concepts)];
      });
      return items;
    }

    function renderCode() {
      hideTooltip();
      tokens = tokenize(input.value);
      const fragment = document.createDocumentFragment();
      tokens.forEach(token => {
        if (!token.concepts.length) { fragment.append(document.createTextNode(token.text)); return; }
        const span = document.createElement('span');
        span.className = `token ${token.style}`;
        span.textContent = token.text;
        token.element = span;
        fragment.append(span);
      });
      // An extra line keeps the mirror and textarea aligned at a trailing newline.
      fragment.append(document.createTextNode('\n'));
      mirror.replaceChildren(fragment);
      const count = input.value.split('\n').length;
      document.getElementById('line-numbers').replaceChildren(...Array.from({ length: count }, (_, i) => { const span = document.createElement('span'); span.textContent = i + 1; return span; }));
      document.getElementById('line-count').textContent = `${count} ${t('lines')}`;
      highlightConcept();
    }
    function highlightConcept() {
      tokens.forEach(token => token.element?.classList.toggle('is-active', token.concepts.includes(selected)));
      document.querySelectorAll('.concept').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.concept === selected)));
    }
    function selectConcept(key, example) {
      selected = key;
      const [name, text] = definition(key);
      document.getElementById('detail-title').textContent = name;
      document.getElementById('detail-definition').textContent = text;
      document.getElementById('detail-icon').textContent = concepts[key].icon;
      document.getElementById('detail-code').textContent = example || concepts[key].example;
      highlightConcept();
    }
    function hideTooltip() {
      clearTimeout(hideTimer);
      tooltip.hidden = true;
      hovered = null;
      input.removeAttribute('aria-describedby');
      input.setAttribute('aria-describedby', 'editor-help');
    }
    function showTooltip(token, x, y) {
      clearTimeout(hideTimer);
      if (hovered !== token) {
        hovered = token;
        const [name, text] = definition(token.concepts[0]);
        document.getElementById('tooltip-title').textContent = name;
        document.getElementById('tooltip-definition').textContent = text;
        const related = token.concepts.slice(1).map(key => definition(key)[0]);
        document.getElementById('tooltip-related').textContent = related.length ? `${t('related')}: ${related.join(' · ')}` : '';
        selectConcept(token.concepts[0], token.text);
      }
      tooltip.hidden = false;
      const bounds = tooltip.getBoundingClientRect();
      tooltip.style.left = `${Math.max(12, Math.min(x, window.innerWidth - bounds.width - 12))}px`;
      tooltip.style.top = `${Math.max(12, y + 16 + bounds.height > window.innerHeight - 12 ? y - bounds.height - 12 : y + 16)}px`;
      input.setAttribute('aria-describedby', 'editor-help token-tooltip');
    }
    function updateLanguage() {
      document.documentElement.lang = language;
      document.title = t('pageTitle');
      document.querySelectorAll('[data-i18n]').forEach(element => element.textContent = t(element.dataset.i18n));
      document.querySelectorAll('[data-label]').forEach(element => element.setAttribute('aria-label', t(element.dataset.label)));
      const toggle = document.getElementById('language-toggle');
      toggle.textContent = language === 'es' ? 'EN · English' : 'ES · Español';
      toggle.lang = language === 'es' ? 'en' : 'es';
      toggle.setAttribute('aria-label', language === 'es' ? 'Switch to English' : 'Cambiar a español');
      document.getElementById('concepts').replaceChildren(...mainConcepts.map(key => {
        const button = document.createElement('button');
        button.type = 'button'; button.className = 'concept'; button.dataset.concept = key;
        const icon = document.createElement('code'); icon.textContent = concepts[key].icon; icon.setAttribute('aria-hidden', 'true');
        const name = document.createElement('span'); name.textContent = definition(key)[0];
        button.append(icon, name);
        button.addEventListener('click', () => { hideTooltip(); selectConcept(key); });
        return button;
      }));
      selectConcept(selected);
      document.getElementById('line-count').textContent = `${input.value.split('\n').length} ${t('lines')}`;
      hideTooltip();
    }
    function inspectCaret() {
      const offset = input.selectionStart;
      const token = tokens.find(item => item.concepts.length && item.start <= offset && item.end > offset);
      if (token) selectConcept(token.concepts[0], token.text);
    }
    input.addEventListener('input', () => { renderCode(); inspectCaret(); });
    input.addEventListener('click', inspectCaret);
    input.addEventListener('keyup', event => { if (event.key.startsWith('Arrow') || event.key === 'Home' || event.key === 'End') inspectCaret(); });
    input.addEventListener('keydown', event => {
      if (event.key === 'Escape') { hideTooltip(); return; }
      if (event.key !== 'Tab' || event.shiftKey || event.ctrlKey || event.metaKey || event.altKey) return;
      event.preventDefault();
      const start = input.selectionStart, end = input.selectionEnd;
      input.setRangeText('    ', start, end, 'end');
      renderCode();
    });
    // The textarea remains fully editable; hit-test the highlighted mirror below it.
    input.addEventListener('pointermove', event => {
      clearTimeout(hideTimer);
      if (event.pointerType === 'touch' || event.buttons) { hideTooltip(); return; }
      const token = tokens.find(item => item.element && Array.from(item.element.getClientRects()).some(rect => event.clientX >= rect.left && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom));
      if (token) showTooltip(token, event.clientX, event.clientY);
      else hideTimer = setTimeout(hideTooltip, 180);
    });
    input.addEventListener('pointerleave', () => { hideTimer = setTimeout(hideTooltip, 180); });
    input.addEventListener('blur', () => { if (!tooltip.matches(':hover')) hideTooltip(); });
    tooltip.addEventListener('pointerenter', () => clearTimeout(hideTimer));
    tooltip.addEventListener('pointerleave', hideTooltip);
    document.addEventListener('keydown', event => { if (event.key === 'Escape') hideTooltip(); });
    scroll.addEventListener('scroll', hideTooltip);
    window.addEventListener('resize', hideTooltip);
    document.getElementById('language-toggle').addEventListener('click', () => { clearTimeout(copyTimer); language = language === 'es' ? 'en' : 'es'; updateLanguage(); });
    document.getElementById('reset-code').addEventListener('click', () => { input.value = initialCode; scroll.scrollTo(0, 0); selectConcept('variable'); renderCode(); });
    document.getElementById('copy-code').addEventListener('click', async () => {
      const button = document.getElementById('copy-code');
      try {
        await navigator.clipboard.writeText(input.value);
        button.textContent = t('copied');
      } catch {
        input.focus(); input.select(); button.textContent = t('copyFailed');
      }
      clearTimeout(copyTimer);
      copyTimer = setTimeout(() => button.textContent = t('copy'), 2400);
    });
    input.value = initialCode;
    renderCode();
    updateLanguage();
  </script>
</body>
</html>
